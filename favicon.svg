<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Liquid Gradient -->
    <linearGradient id="liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing Aura -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="64" height="64" rx="16" fill="#05060b" />

  <!-- Top Glass Brick -->
  <rect x="8" y="14" width="48" height="14" rx="4" fill="url(#liquid)" filter="url(#glow)" />
  <!-- Glass Reflection Specular -->
  <rect x="10" y="16" width="44" height="3" rx="1.5" fill="white" fill-opacity="0.6" />

  <!-- Glowing Ball -->
  <circle cx="32" cy="42" r="7" fill="#ffffff" filter="url(#glow)" />

  <!-- Mini Paddle Bar -->
  <rect x="14" y="52" width="36" height="5" rx="2.5" fill="#38bdf8" fill-opacity="0.7" />
</svg>